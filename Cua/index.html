<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<style>
html,body{background:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:13px;color:CanvasText;padding:10px 12px;box-sizing:border-box;user-select:none;-webkit-user-select:none;cursor:default}
.head{display:flex;align-items:center;height:40px;gap:0}
h1{font-size:30px;font-weight:200;letter-spacing:.5px;margin:0;line-height:40px;flex:0 0 auto}
.portbox{margin-left:auto;display:flex;gap:5px;align-items:center}
.portbox input{width:60px;height:26px;padding:0 7px;user-select:text;-webkit-user-select:text;cursor:text;border-radius:7px;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);background:color-mix(in srgb,Canvas 88%,transparent);color:CanvasText;font:inherit;font-size:13px}
button{padding:0 10px;height:26px;border-radius:7px;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);background:color-mix(in srgb,Canvas 85%,transparent);color:CanvasText;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
button:hover{background:color-mix(in srgb,CanvasText 10%,transparent)}
#quit{background:rgba(255,59,48,.08);border-color:rgba(255,59,48,.28);color:#ff3b30}
#quit:hover{background:rgba(255,59,48,.16)}
#list{margin-top:10px;min-height:120px}
.sess{display:flex;gap:8px;align-items:center;padding:3px 2px}
.sess+.sess{border-top:1px solid color-mix(in srgb,CanvasText 10%,transparent)}
.sess img{width:20px;height:20px;border-radius:4px;flex:0 0 auto}
.sess .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sess button{height:22px;font-size:11px;padding:0 8px}
.empty{color:color-mix(in srgb,CanvasText 60%,transparent);font-size:12px;padding:10px 2px}
.perm{padding:6px 2px;font-size:13px}
.perm+.perm{border-top:1px solid color-mix(in srgb,CanvasText 10%,transparent)}
.perm .st{display:inline-block;width:20px;font-weight:600}
.perm .ok{color:#30d158}.perm .bad{color:#ff453a}
.perm button{margin-top:8px}
</style></head><body>
<div class="head"><h1>Cua</h1><div class="portbox"><input id="port" type="number" min="1024" max="65535"><button id="apply">Apply</button><button id="copy" title="Copy setup prompt">Copy</button><button id="quit" title="Quit Cua">Quit</button></div></div>
<div id="list"><div class="empty">No apps held.</div></div>
<script>
let state=null;
async function fetchState(){ return (await (await fetch('/api/state')).json()); }
function renderPerms(s){
 const L=document.getElementById('list');
 if(s.ax && s.scr){ renderSessions(s); return; }
 L.innerHTML='';
 const rows=[
  {ok:s.scr, label:'Screen Recording'},
  {ok:s.ax, label:'Accessibility'},
 ];
 for(const r of rows){
  const d=document.createElement('div');d.className='perm';
  const st=document.createElement('span');st.className='st '+(r.ok?'ok':'bad');st.textContent=r.ok?'✓':'✕';
  d.append(st,document.createTextNode(' '+r.label));
  L.append(d);
 }
 const b=document.createElement('button');b.textContent='Open Settings';b.style.marginTop='10px';
 b.onclick=async()=>{await fetch('/api/open-settings',{method:'POST'});};
 const wrap=document.createElement('div');wrap.className='perm';wrap.append(b);L.append(wrap);
 const g=document.createElement('button');g.textContent='Grant permissions';g.style.marginTop='6px';
 g.onclick=async()=>{await fetch('/api/grant',{method:'POST'});setTimeout(refresh,900);};
 wrap.append(g);
}
function renderSessions(s){
 const L=document.getElementById('list');
 if(!s.sessions||!s.sessions.length){L.innerHTML='<div class="empty">No apps held.</div>';return;}
 L.innerHTML='';
 for(const x of s.sessions){
  const d=document.createElement('div');d.className='sess';
  if(x.icon){const img=document.createElement('img');img.src='data:image/png;base64,'+x.icon;d.append(img);}
  const n=document.createElement('div');n.className='n';n.textContent=x.app;
  const b=document.createElement('button');b.textContent='Free';
  b.title='Frees the lease — next acquire gets a fresh ID. Old ID becomes invalid.';
  b.onclick=async()=>{await fetch('/api/free',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:x.pid})});refresh();};
  d.append(n,b);L.append(d);
 }
}
function render(s){
 if(s.ax && s.scr) renderSessions(s);
 else renderPerms(s);
}
async function refresh(){
 try{ state=await fetchState(); }catch(e){ return; }
 document.getElementById('port').value=state.port;
 render(state);
}
document.getElementById('apply').onclick=async()=>{
 const v=+document.getElementById('port').value;
 if(v>=1024&&v<=65535){await fetch('/api/port',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port:v})});setTimeout(refresh,200);}
};
document.getElementById('copy').onclick=async()=>{
 const url='http://127.0.0.1:'+document.getElementById('port').value+'/mcp';
 const prompt='Setup prompt for Cua: the mcp.json is `'+JSON.stringify({mcpServers:{cua:{url:url}}})+'`, add it to the harness of my choice. Ask me a question on the specifics..';
 await navigator.clipboard.writeText(prompt);
 const b=document.getElementById('copy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200);
};
document.getElementById('quit').onclick=async()=>{await fetch('/api/quit',{method:'POST'});};
// Permissions are checked on focus (not polled) — sessions poll every 1s.
window.addEventListener('focus',refresh);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
refresh();setInterval(refresh,1000);
</script></body></html>
