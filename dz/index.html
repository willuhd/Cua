<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<title>dz</title>
<style>
  :root{
    --hairline: rgba(127,127,127,.24);
    --muted: rgba(127,127,127,.62);
    --btn-bg: rgba(255,255,255,.10);
    --btn-active: rgba(255,255,255,.20);
    --field-bg: rgba(255,255,255,.08);
  }
  @supports (color: color-mix(in srgb, black, white)) {
    :root{
      --hairline: color-mix(in srgb, CanvasText 16%, transparent);
      --muted: color-mix(in srgb, CanvasText 58%, transparent);
      --btn-bg: color-mix(in srgb, CanvasText 7%, transparent);
      --btn-active: color-mix(in srgb, CanvasText 13%, transparent);
      --field-bg: color-mix(in srgb, CanvasText 5%, transparent);
    }
  }
  html,body{min-height:100%;height:auto;margin:0;padding:0;background:transparent;overflow-x:hidden}
  body{font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:CanvasText;user-select:none;-webkit-user-select:none;cursor:default}
  .app{width:380px;max-width:calc(100vw - 24px);min-height:100%;padding:10px 14px 16px;box-sizing:border-box;margin:0 auto}
  .head{display:flex;align-items:center;min-height:36px;gap:10px}
  h1{font-size:24px;font-weight:350;letter-spacing:.2px;margin:0;flex:0 0 auto}
  .tabs{margin-left:auto;display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--btn-bg)}
  .tabs button{height:24px;padding:0 9px;font-size:12px;border-radius:5px;background:transparent;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:color-mix(in srgb, Canvas 88%, transparent);color:CanvasText;box-shadow:0 1px 2px rgba(0,0,0,.10)}
  .tabs #quit{color:#ff453a;margin-left:2px}

  button{-webkit-appearance:none;appearance:none;border:0;height:27px;padding:0 11px;border-radius:6px;font:500 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:CanvasText;cursor:default;white-space:nowrap;background:var(--btn-bg)}
  button:hover{background:var(--btn-active)}
  button:active{background:var(--btn-active)}
  button:focus-visible{outline:2px solid -webkit-focus-ring-color;outline-offset:2px}
  button:disabled{opacity:.4;pointer-events:none}
  button.primary{background:#0a84ff;color:#fff}
  button.primary:hover{background:#2b91ff}
  button.destructive{color:#ff453a;background:transparent}
  button.small{height:23px;font-size:11.5px;padding:0 8px;border-radius:5px}
  button.icon{width:26px;padding:0;font-size:15px;color:var(--muted);background:transparent}

  input,select{height:25px;padding:0 7px;box-sizing:border-box;border-radius:6px;border:1px solid var(--hairline);background:var(--field-bg);color:CanvasText;font:inherit;font-size:12px;outline:none}
  input:focus,select:focus{border-color:color-mix(in srgb, CanvasText 42%, transparent)}
  input[type=number]{font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;height:18px;padding:0;border:0;background:transparent;accent-color:#0a84ff}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:color-mix(in srgb, CanvasText 14%, transparent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.18);box-shadow:0 1px 2px rgba(0,0,0,.18)}

  section[hidden]{display:none}
  .panel{margin-top:8px}
  .section{margin-top:13px}
  .section:first-child{margin-top:2px}
  .section-title{font-size:13px;font-weight:600;margin:0 0 6px;color:CanvasText}
  .section-note{font-size:11.5px;color:var(--muted);line-height:1.4;margin:5px 0 0}
  .divider{height:1px;background:var(--hairline);margin:10px 0}

  .host-row{display:flex;align-items:center;gap:9px;padding:7px 0;min-width:0}
  .host-row+.host-row{border-top:.5px solid var(--hairline)}
  .host-glyph{width:29px;height:29px;border-radius:7px;background:var(--btn-bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .host-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .host-alias{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .host-meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .host-actions{display:flex;gap:3px;align-items:center}

  .form{display:flex;flex-direction:column;gap:7px;padding:8px;border:1px solid var(--hairline);border-radius:8px;background:var(--field-bg)}
  .form-row{display:flex;gap:7px;align-items:center}
  .form-row input{flex:1;min-width:0}
  .form-actions{display:flex;justify-content:flex-end;gap:7px}

  .field{display:grid;grid-template-columns:112px 1fr 64px;align-items:center;gap:8px;padding:5px 0}
  .field-label{font-size:12px;color:var(--muted)}
  .field input[type=range]{width:100%}
  .field input[type=number],.field select{width:64px;text-align:right}
  .field.wide{grid-template-columns:112px 1fr}
  .field.wide input,.field.wide select{width:100%;text-align:left}
  .resolution-value{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

  .stat{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0}
  .stat .value{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .status-card{padding:9px 10px;border-radius:8px;background:var(--field-bg)}
  .status-title{font-size:13px;font-weight:600;margin-bottom:3px}
  .status-sub{font-size:11px;color:var(--muted);line-height:1.35}
  .empty{font-size:12px;color:var(--muted);padding:9px 0;line-height:1.4}

  .perm-card{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0}
  .perm-icon{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .perm-icon img{width:40px;height:40px;border-radius:9px;display:block}
  .perm-rows{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
  .perm-row{display:flex;align-items:center;gap:6px;line-height:18px}
  .perm-row .st{width:14px;text-align:center;font-weight:600}
  .perm-row .ok{color:#30d158}.perm-row .bad{color:#ff453a}
  .perm-actions{display:flex;gap:8px;justify-content:center;margin-top:6px}

  details summary{font-size:12px;color:var(--muted);cursor:default;padding:5px 0}
  details .details-body{padding-top:2px}
</style></head><body>
<main class="app">
  <div class="head">
    <h1>dz</h1>
    <nav class="tabs" role="tablist" aria-label="dz">
      <button role="tab" data-tab="agents" aria-selected="true">Agents</button>
      <button role="tab" data-tab="remote" aria-selected="false">Remote</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
      <button id="quit" type="button" title="Quit dz">Quit</button>
    </nav>
  </div>
  <div id="perms"></div>
  <section class="panel" id="panel-agents" role="tabpanel"></section>
  <section class="panel" id="panel-remote" role="tabpanel" hidden></section>
  <section class="panel" id="panel-settings" role="tabpanel" hidden></section>
</main>
<script>
let state = null;
let lastSig = "";
let lastHeight = 0;
let inFlight = false;
let pendingRefresh = false;
let tab = "agents";
let hostForm = null;
let shareDisplays = [];
const draft = { address: "", settings: {} };
const $ = id => document.getElementById(id);

async function postJSON(path, body){
  const headers = {'Content-Type':'application/json'};
  if (window.__DZ_UI_TOKEN) headers['X-Dz-UI-Token'] = window.__DZ_UI_TOKEN;
  return fetch(path, {method:'POST', headers, body:JSON.stringify(body || {})});
}
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function section(title){
  const box = el('div','section');
  box.append(el('div','section-title', title));
  return box;
}
function isTyping(){
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA');
}
function contentHeight(){
  const app = document.querySelector('.app');
  return Math.ceil(app ? app.getBoundingClientRect().height : document.documentElement.scrollHeight);
}
function postHeight(){
  if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.dzHeight) return;
  const h = Math.max(150, Math.min(720, contentHeight()));
  if (Math.abs(h - lastHeight) < 1) return;
  lastHeight = h;
  window.webkit.messageHandlers.dzHeight.postMessage(h);
}
function sendPermRect(show, rect){
  if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.dzPermRect) return;
  if (!show || !rect) { window.webkit.messageHandlers.dzPermRect.postMessage({show:false}); return; }
  window.webkit.messageHandlers.dzPermRect.postMessage({show:true, x:rect.left, y:rect.top, width:rect.width, height:rect.height});
}
function switchTab(name){
  tab = name;
  for (const b of document.querySelectorAll('.tabs [data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === name));
  for (const id of ['agents','remote','settings']) $('panel-' + id).hidden = id !== name;
  if (state) render(state);
}

function renderPerms(s){
  const P = $('perms');
  P.replaceChildren();
  if (s.ax && s.scr) { sendPermRect(false); return; }
  const card = el('div','perm-card');
  const iconWrap = el('div','perm-icon');
  if (s.appIcon) {
    const img = el('img');
    img.src = 'data:image/png;base64,' + s.appIcon;
    img.alt = 'dz'; img.draggable = true;
    img.title = 'Drag dz.app into the permission list';
    img.addEventListener('dragstart', ev => {
      if (!s.appPath) return;
      ev.dataTransfer.setData('text/uri-list', encodeURI('file://' + s.appPath));
      ev.dataTransfer.setData('text/plain', s.appPath);
      ev.dataTransfer.effectAllowed = 'copy';
    });
    iconWrap.append(img);
  }
  const rows = el('div','perm-rows');
  for (const r of [{ok:s.scr,label:'Screen Recording'},{ok:s.ax,label:'Accessibility'}]) {
    const d = el('div','perm-row');
    d.append(el('span','st ' + (r.ok ? 'ok' : 'bad'), r.ok ? '\u2713' : '\u2715'));
    d.append(document.createTextNode(r.label)); rows.append(d);
  }
  card.append(iconWrap, rows); P.append(card);
  const actions = el('div','perm-actions');
  const open = el('button',null,'Open Settings'); open.type='button';
  open.onclick = async () => { await postJSON('/api/open-settings',{}); };
  const grant = el('button',null,'Grant'); grant.type='button';
  grant.onclick = async () => { await postJSON('/api/grant',{}); setTimeout(refresh,900); };
  actions.append(open,grant); P.append(actions);
  requestAnimationFrame(() => { if (s.appIcon) sendPermRect(true, iconWrap.getBoundingClientRect()); else sendPermRect(false); });
}

function ago(ms){
  if (!ms) return 'never';
  const m = Math.floor((Date.now()-ms)/60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}
function renderAgents(s){
  const P = $('panel-agents'); P.replaceChildren();
  const apps = s.apps || [];
  if (!apps.length) P.append(el('div','empty','No apps held. An agent appears here when it takes one.'));
  for (const a of apps) {
    const d = el('div','host-row');
    const glyph = el('div','host-glyph');
    if (a.icon) { const img=el('img'); img.src='data:image/png;base64,'+a.icon; img.style.width='29px'; img.style.height='29px'; img.style.borderRadius='7px'; glyph.append(img); }
    else glyph.textContent = a.app ? a.app.charAt(0).toUpperCase() : '?';
    const copy = el('div','host-copy');
    copy.append(el('div','host-alias',a.app));
    copy.append(el('div','host-meta',ago(a.lastActivity) + ' · ' + (a.token || '')));
    const b=el('button','small destructive','Stop'); b.type='button';
    b.title='Drop this app\'s leases and stop a grant holding this Mac';
    b.onclick=()=>postJSON('/api/free',{pid:a.pid}).then(refresh);
    d.append(glyph,copy,b); P.append(d);
  }
  const fg=s.foreground||{mode:'idle'};
  if (fg.mode==='pending') {
    const box=section('Full Mac control');
    box.append(el('div','status-sub',(fg.agent||'An agent')+' wants full control of this Mac.'));
    const actions=el('div','form-actions');
    const deny=el('button','small','Deny'); deny.type='button';
    deny.onclick=async()=>{await postJSON('/api/foreground',{action:'deny',requestId:fg.requestId});refresh();};
    const allow=el('button','small primary','End Background & Allow'); allow.type='button';
    allow.onclick=async()=>{
      allow.disabled=true;allow.textContent='Waiting…';let ok=false;
      try{ok=(await postJSON('/api/foreground',{action:'approve',requestId:fg.requestId})).ok;}catch(e){}
      if(!ok&&allow.isConnected){allow.disabled=false;allow.textContent='End Background & Allow';}
      refresh();
    };
    if(!window.__DZ_UI_TOKEN){allow.disabled=true;deny.disabled=true;}
    actions.append(deny,allow);box.append(actions);P.append(box);
  } else if (fg.mode==='active') {
    const box=section('Full Mac control');
    box.append(el('div','status-sub',(fg.agent||'Agent')+' is controlling this Mac.'));
    if(fg.observation==='needs-screenshot')box.append(el('div','status-sub','Needs a first screenshot.'));
    else if(fg.observation==='stale')box.append(el('div','status-sub','Screen changed; the agent will re-check.'));
    const stop=el('button','small destructive','Stop');stop.type='button';
    stop.onclick=async()=>{await postJSON('/api/foreground',{action:'stop'});refresh();};
    if(!window.__DZ_UI_TOKEN)stop.disabled=true;
    box.append(stop);P.append(box);
  }
}

function hostFormBox(s){
  const box=el('div','form');
  const editing=hostForm&&hostForm.id;
  const alias=el('input');alias.placeholder='Name';alias.value=editing?hostForm.alias:'';
  const address=el('input');address.placeholder='Host name or 100.x address';address.value=editing?hostForm.address:draft.address;
  const profile=el('input');profile.placeholder='Profile name';profile.value=editing?hostForm.profileName:'Default';
  const row1=el('div','form-row');row1.append(alias,address);
  box.append(row1,profile);
  const actions=el('div','form-actions');
  const cancel=el('button','small','Cancel');cancel.type='button';cancel.onclick=()=>{hostForm=null;render(state);};
  const save=el('button','small primary',editing?'Save':'Add Host');save.type='button';
  save.onclick=async()=>{
    const body={action:editing?'update':'add',id:editing?hostForm.id:undefined,alias:alias.value,address:address.value,profileName:profile.value};
    if(editing)body.settings=hostForm.settings;
    const r=await postJSON('/api/hosts',body);
    if(r.ok){hostForm=null;draft.address='';await refresh(true);}
  };
  actions.append(cancel,save);box.append(actions);return box;
}
function renderRemote(s){
  const P=$('panel-remote');P.replaceChildren();
  const sess=s.session||{role:'idle'};
  if(sess.role==='idle'){
    const share=section('This Mac');
    const shareBtn=el('button','primary','Share This Mac');shareBtn.type='button';
    shareBtn.onclick=async()=>{
      shareBtn.disabled=true;
      const r=await postJSON('/api/session',{action:'host'});
      shareBtn.disabled=false;
      if(r.ok){const body=await r.json();if(body.needsDisplaySelection){shareDisplays=body.displays||[];render(state);}else await refresh(true);}
    };
    share.append(shareBtn);
    if(shareDisplays.length){
      share.append(el('div','section-note','Choose a display to share.'));
      for(const d of shareDisplays){
        const b=el('button','small',d.name+' · '+d.width+' × '+d.height);b.type='button';
        b.onclick=async()=>{await postJSON('/api/session',{action:'host',displayId:d.id});shareDisplays=[];await refresh(true);};
        share.append(b);
      }
    }
    P.append(share);

    const hosts=section('Saved Hosts');
    const add=el('button','small','Add Host…');add.type='button';add.onclick=()=>{hostForm={};render(state);};
    const titleRow=el('div');titleRow.style.display='flex';titleRow.style.justifyContent='space-between';titleRow.style.alignItems='center';
    titleRow.replaceChildren(el('div','section-title','Saved Hosts'),add);
    hosts.replaceChildren(titleRow);
    if(hostForm)hosts.append(hostFormBox(s));
    const list=s.hosts||[];
    if(!list.length&&!hostForm)hosts.append(el('div','empty','No saved hosts. Add one to keep its address and profile.'));
    for(const h of list){
      const row=el('div','host-row');
      const glyph=el('div','host-glyph');glyph.textContent='⌘';
      const copy=el('div','host-copy');
      copy.append(el('div','host-alias',h.alias));
      copy.append(el('div','host-meta',h.address+' · '+h.profileName));
      const actions=el('div','host-actions');
      const edit=el('button','icon','⋯');edit.type='button';edit.title='Edit host and profile';edit.onclick=()=>{hostForm=JSON.parse(JSON.stringify(h));render(state);};
      const del=el('button','icon','×');del.type='button';del.title='Delete host';del.onclick=async()=>{await postJSON('/api/hosts',{action:'delete',id:h.id});await refresh(true);};
      const connect=el('button','small','Connect');connect.type='button';connect.onclick=async()=>{await postJSON('/api/session',{action:'client',hostId:h.id});await refresh(true);};
      actions.append(edit,del,connect);row.append(glyph,copy,actions);hosts.append(row);
    }
    P.append(hosts);
    if(sess.error)P.append(el('div','status-sub',sess.error));
  } else {
    const title=sess.role==='host'?'Sharing This Mac':(sess.profileName||'Connected');
    const box=section(title);
    const card=el('div','status-card');
    card.append(el('div','status-title',sess.status||''));
    const display=sess.hostState&&sess.hostState.displays?sess.hostState.displays.find(d=>d.id===sess.hostState.displayID):null;
    if(display)card.append(el('div','status-sub',display.name+' · '+display.width+' × '+display.height));
    if(sess.role==='host'&&!sess.configured)card.append(el('div','status-sub','Waiting for a client to choose its stream settings.'));
    box.append(card);
    const stats=[['Encode rate',(Math.round((sess.fps||0)*10)/10)+' fps'],['Target',(sess.targetFps||(sess.settings&&sess.settings.frameRate)||0)+' fps'],['Frames',String(sess.frames||0)],['Packets',String(sess.packets||0)]];
    if(sess.skipped)stats.push(['Skipped',String(sess.skipped)]);
    if(sess.dropped)stats.push(['Dropped',String(sess.dropped)]);
    if(sess.bytes)stats.push(['Sent',(sess.bytes/1048576).toFixed(1)+' MB']);
    for(const [k,v] of stats){const d=el('div','stat');const value=el('span','value',v);value.id='stat-'+k.toLowerCase().replace(/[^a-z]/g,'');d.append(el('span','',k),value);box.append(d);}
    const stop=el('button','destructive','Stop Session');stop.type='button';stop.onclick=()=>postJSON('/api/session',{action:'stop'}).then(refresh);
    box.append(stop);P.append(box);
  }
}

function sliderField(label,min,max,step,value,number,onChange){
  const row=el('div','field');
  const range=el('input');range.type='range';range.min=String(min);range.max=String(max);range.step=String(step);range.value=String(value);
  const num=el('input');num.type='number';num.min=String(min);num.max=String(number.max);num.step=String(step);num.value=String(number.value);
  range.addEventListener('input',()=>{num.value=range.value;onChange(Number(range.value));});
  num.addEventListener('input',()=>{const v=Number(num.value);if(Number.isFinite(v)){range.value=String(Math.max(min,Math.min(max,v)));onChange(v);}});
  row.append(el('div','field-label',label),range,num);return row;
}
function selectedDisplay(s){
  const hs=s.session&&s.session.hostState;
  const list=(hs&&hs.displays)||s.displays||[];
  return list.find(d=>d.id===(hs&&hs.displayID))||list[0]||null;
}
function renderSettings(s){
  const P=$('panel-settings');P.replaceChildren();
  const general=section('General');
  const port=el('input');port.type='number';port.min='1024';port.max='65535';port.value=String(s.port||3060);
  port.addEventListener('input',()=>{draft.settings.port=port.value;});
  const portRow=el('div','field wide');portRow.append(el('div','field-label','MCP port'),port);general.append(portRow);
  const applyPort=el('button','small','Apply Port');applyPort.type='button';
  applyPort.onclick=async()=>{const r=await postJSON('/api/port',{port:Number(port.value)});if(r.ok)setTimeout(()=>location.replace('http://127.0.0.1:'+port.value+'/'),400);};
  general.append(applyPort);P.append(general);

  const sess=s.session||{role:'idle'};
  if(sess.role!=='client'){
    const info=section('Stream');
    info.append(el('div','empty','Stream controls appear when this Mac is connected to a host. They belong to that host and its profile.'));
    P.append(info);postHeight();return;
  }

  const stream=sess.settings||s.stream||{};
  const display=selectedDisplay(s);
  const nativeW=display?display.width:(stream.width||1920);
  const nativeH=display?display.height:(stream.height||1080);
  const box=section('Stream');
  const profile=el('input');profile.type='text';profile.value=sess.profileName||'Default';
  profile.addEventListener('input',()=>{draft.settings.profileName=profile.value;});
  const profileRow=el('div','field wide');profileRow.append(el('div','field-label','Profile'),profile);box.append(profileRow);

  if(display){
    const scale=Math.max(25,Math.min(100,Math.round((stream.width||nativeW)/nativeW*100/5)*5));
    const range=el('input');range.type='range';range.min='25';range.max='100';range.step='5';range.value=String(scale);
    const value=el('div','resolution-value',Math.round(nativeW*scale/100/2)*2+' × '+Math.round(nativeH*scale/100/2)*2);
    range.addEventListener('input',()=>{const n=Number(range.value);value.textContent=Math.round(nativeW*n/100/2)*2+' × '+Math.round(nativeH*n/100/2)*2;draft.settings.resolutionScale=n;});
    const row=el('div','field');row.append(el('div','field-label','Resolution'),range,value);box.append(row);
    box.append(el('div','section-note',display.name+' · '+nativeW+' × '+nativeH));
  } else {
    box.append(el('div','section-note','Waiting for the host to report its displays.'));
  }

  const bitrate=Math.round((stream.bitrate||8000000)/100000)/10;
  box.append(sliderField('Bitrate',0.5,10,0.5,bitrate,{value:bitrate,max:200},v=>{draft.settings.bitrate=v;}));
  box.append(el('div','section-note','Mbps · slider 0.5–10, type a custom value.'));
  const fps=stream.frameRate||60;
  box.append(sliderField('Frame rate',5,60,1,fps,{value:fps,max:240},v=>{draft.settings.frameRate=v;}));
  box.append(el('div','section-note','fps · type 75 or higher for a custom target.'));

  const details=el('details');details.append(el('summary','','Advanced'));
  const body=el('div','details-body');
  const preset=el('input');preset.type='number';preset.min='0';preset.max='13';preset.value=String(stream.preset??10);
  const presetRow=el('div','field wide');presetRow.append(el('div','field-label','SVT preset'),preset);body.append(presetRow);
  const rc=el('select');for(const v of ['cbr','vbr']){const o=el('option',null,v.toUpperCase());o.value=v;if((stream.rateControl||'cbr')===v)o.selected=true;rc.append(o);}
  const rcRow=el('div','field wide');rcRow.append(el('div','field-label','Rate control'),rc);body.append(rcRow);
  const fec=el('input');fec.type='number';fec.min='0';fec.max='100';fec.value=String(Math.round((stream.fecOverhead??0.2)*100));
  const fecRow=el('div','field wide');fecRow.append(el('div','field-label','Parity (%)'),fec);body.append(fecRow);
  const jitter=el('input');jitter.type='number';jitter.min='1';jitter.max='30';jitter.value=String(stream.jitterFrames??3);
  const jitterRow=el('div','field wide');jitterRow.append(el('div','field-label','Jitter buffer'),jitter);body.append(jitterRow);
  const pointer=el('select');for(const v of ['free','locked']){const o=el('option',null,v==='free'?'Free (desktop)':'Locked (game)');o.value=v;if((stream.pointer||'free')===v)o.selected=true;pointer.append(o);}
  const pointerRow=el('div','field wide');pointerRow.append(el('div','field-label','Pointer'),pointer);body.append(pointerRow);
  details.append(body);box.append(details);

  const apply=el('button','primary','Apply');apply.type='button';
  apply.onclick=async()=>{
    const scale=Number(draft.settings.resolutionScale||Math.round((stream.width||nativeW)/nativeW*100));
    const patch={
      profileName:profile.value,
      width:display?Math.round(display.width*scale/100/2)*2:stream.width,
      height:display?Math.round(display.height*scale/100/2)*2:stream.height,
      bitrate:Math.round(Number(draft.settings.bitrate??bitrate)*1000000),
      frameRate:Number(draft.settings.frameRate??fps),
      preset:Number(preset.value),rateControl:rc.value,
      fecOverhead:Number(fec.value)/100,jitterFrames:Number(jitter.value),pointer:pointer.value
    };
    apply.disabled=true;apply.textContent='Applying…';
    const r=await postJSON('/api/settings',patch);
    if(r.ok){draft.settings={};apply.textContent='Applied';setTimeout(()=>{apply.textContent='Apply';apply.disabled=false;},800);await refresh(true);}
    else{apply.disabled=false;apply.textContent='Apply';}
  };
  box.append(apply);P.append(box);
}

function signature(s){
  return JSON.stringify({
    ax:s.ax,scr:s.scr,port:s.port,tab,
    hosts:s.hosts||[],
    displays:s.displays||[],
    session:s.session?{
      role:s.session.role,hostId:s.session.hostId,profileName:s.session.profileName,
      settings:s.session.settings,configured:s.session.configured,
      hostState:s.session.hostState,error:s.session.error
    }:null,
    apps:(s.apps||[]).map(x=>[x.pid,x.lastActivity,x.token]),
    fg:s.foreground?[s.foreground.mode,s.foreground.requestId,s.foreground.observation]:null,
    stream:s.stream
  });
}
function render(s){
  renderPerms(s);
  if(tab==='agents')renderAgents(s);
  if(tab==='remote')renderRemote(s);
  if(tab==='settings')renderSettings(s);
  requestAnimationFrame(postHeight);
}
function updateStats(s){
  const sess=s.session||{role:'idle'};if(sess.role==='idle')return;
  const put=(id,text)=>{const n=document.getElementById(id);if(n)n.textContent=text;};
  put('stat-encoderate',(Math.round((sess.fps||0)*10)/10)+' fps');
  put('stat-frames',String(sess.frames||0));put('stat-packets',String(sess.packets||0));
  put('stat-skipped',String(sess.skipped||0));put('stat-dropped',String(sess.dropped||0));
  if(sess.bytes)put('stat-sent',(sess.bytes/1048576).toFixed(1)+' MB');
}
setInterval(async()=>{
  if(document.hidden||!state)return;
  const sess=state.session||{role:'idle'};if(sess.role==='idle')return;
  try{const fresh=await(await fetch('/api/state',{cache:'no-store'})).json();state=fresh;updateStats(fresh);}catch(e){}
},1000);
async function refresh(force){
  if(document.hidden&&!force)return;
  if(inFlight){pendingRefresh=true;return;}
  inFlight=true;let s;
  try{s=await(await fetch('/api/state',{cache:'no-store'})).json();}
  catch(e){inFlight=false;if(pendingRefresh){pendingRefresh=false;refresh();}return;}
  inFlight=false;state=s;
  const sig=signature(s);
  if(sig!==lastSig){lastSig=sig;if(!isTyping())render(s);}
  else postHeight();
  if(pendingRefresh){pendingRefresh=false;refresh();}
}

for(const b of document.querySelectorAll('.tabs [data-tab]'))b.onclick=()=>switchTab(b.dataset.tab);
$('quit').onclick=async()=>{await postJSON('/api/quit',{});};
window.addEventListener('focus',()=>refresh(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});
if(window.ResizeObserver){new ResizeObserver(()=>requestAnimationFrame(postHeight)).observe(document.querySelector('.app'));}
switchTab('agents');refresh(true);
</script></body></html>
